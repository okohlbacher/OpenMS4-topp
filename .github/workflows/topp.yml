name: TOPP

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} / Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            packages: gcc_linux-64=14 gxx_linux-64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            packages: gcc_linux-aarch64=14 gxx_linux-aarch64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: macos-arm64
            runner: macos-15
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 2
          - platform: macos-x64
            runner: macos-15-intel
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 4
          - platform: windows-x64
            runner: windows-2022
            packages: glpk=5.*
            jobs: 4
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-cli
          ref: c19e49414bcd9ebdea42f89b3f74d2823205892c
          path: dependencies/cli
          ssh-key: ${{ secrets.OPENMS4_CLI_DEPLOY_KEY }}
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/ci/environment.yml
          micromamba-version: 2.9.0-0
          create-args: ${{ matrix.packages }}
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          cache-environment-key: topp-${{ matrix.platform }}
      - name: Download and verify the pinned Core SDK
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/core"
          gh release download core-v4.0.0-ci.1 --repo okohlbacher/OpenMS4-core \
            --pattern "OpenMS4-core-${{ matrix.platform }}-Release-94a2b114939e.tar.gz*" \
            --dir "${{ runner.temp }}/core"
          cd "${{ runner.temp }}/core"
          shasum -a 256 -c *.sha256
          tar -xzf *.tar.gz
      - name: Build, test, install, and package TOPP
        run: >-
          micromamba run -n topp-ci python tools/ci/run.py
          --platform ${{ matrix.platform }} --jobs ${{ matrix.jobs }}
          --core-dir "${{ runner.temp }}/core"
          --cli-source dependencies/cli
          --work-dir "${{ runner.temp }}/topp"
      - name: Upload tested TOPP package
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: topp-${{ matrix.platform }}
          path: ${{ runner.temp }}/topp/dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: results-${{ matrix.platform }}
          path: ${{ runner.temp }}/topp/results/
          if-no-files-found: warn

  homebrew-cask:
    name: Homebrew cask payload / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            jobs: 2
          - platform: macos-x64
            runner: macos-15-intel
            jobs: 4
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-cli
          ref: c19e49414bcd9ebdea42f89b3f74d2823205892c
          path: dependencies/cli
          ssh-key: ${{ secrets.OPENMS4_CLI_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install the pinned Core formula
        run: >-
          brew install --formula --build-from-source
          https://raw.githubusercontent.com/okohlbacher/OpenMS4-core/codex/package-split/packaging/homebrew/Formula/openms4-core.rb
      - name: Build and test the cask payload
        run: >-
          python3 tools/ci/run_homebrew.py --platform ${{ matrix.platform }}
          --jobs ${{ matrix.jobs }} --cli-source dependencies/cli
          --work-dir "${{ runner.temp }}/topp-homebrew"
      - name: Upload tested cask payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cask-${{ matrix.platform }}
          path: ${{ runner.temp }}/topp-homebrew/dist/*
          if-no-files-found: error
          compression-level: 0
